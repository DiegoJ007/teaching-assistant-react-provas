<table>
  <tr>
    <td><label>Nome: </label></td>
    <td><input [(ngModel)]="aluno.nome"></td>
  </tr>
  <tr>
    <td><label>CPF: </label></td>
    <td><input [(ngModel)]="aluno.cpf"></td>
  </tr>
  <tr>
    <td><label>e-mail: </label></td>
    <td><input [(ngModel)]="aluno.email"></td>
  </tr>
  <tr>
    <td><label>GitHub: </label></td>
    <td><input [(ngModel)]="aluno.github"></td>
  </tr>
</table>
<button (click)="gravar(aluno)">Gravar</button>

<br><br>

<table border="1">
  <tr>
    <th>Nome</th>
    <th>CPF</th>
    <th>e-mail</th>
    <th>GitHub</th>
  </tr>
  <tr *ngFor="let a of alunos">
    <td>{{a.nome}}</td>
    <td>{{a.cpf}}</td>
    <td>{{a.email}}</td>
    <td>{{a.github}}</td>
  </tr>
</table>
