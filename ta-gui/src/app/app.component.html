<table (mousemove)="onMove()">
  <tr>
    <td><label>Nome: </label></td>
    <td><input [(ngModel)]="aluno.nome"></td>
  </tr>
  <tr>
    <td><label>CPF: </label></td>
    <td><input [(ngModel)]="aluno.cpf"></td>
    <td *ngIf="cpfduplicado" style="color: red; padding-left: 10px;">Já existe um aluno com esse CPF!</td>
  </tr>
  <tr>
    <td><label>e-mail: </label></td>
    <td><input [(ngModel)]="aluno.email"></td>
  </tr>
  <tr>
    <td><label>GitHub: </label></td>
    <td><input [(ngModel)]="aluno.github"></td>
  </tr>
</table>
<button (click)="criarAluno(aluno)">Gravar</button>

<br><br>

<table class="alunos">
  <tr>
    <th>Nome</th>
    <th>CPF</th>
    <th>e-mail</th>
    <th>Requisitos</th>
    <th>Ger. Configuração</th>
  </tr>
  <tr *ngFor="let a of alunos">
    <td>{{a.nome}}</td>
    <td>{{a.cpf}}</td>
    <td>{{a.email}}</td>
    <td><input [(ngModel)]="a.metas['requisitos']" (change)="atualizarAluno(a)"></td>
    <td><input [(ngModel)]="a.metas['gerenciamentoDeConfiguracao']" (change)="atualizarAluno(a)"></td>
  </tr>
</table>
